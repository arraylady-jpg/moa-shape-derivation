[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "moa-shape-derivation"
version = "0.1.0"
description = "Derives GPU kernel code-generation parameters from measured hardware shape, rather than from tuning or search."
readme = "README.md"
license = {text = "Apache-2.0"}
authors = [
    {name = "Lenore Mullin", email = "lmullin@albany.edu"}
]
requires-python = ">=3.8"
dependencies = []
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Hardware",
    "Topic :: Software Development :: Compilers",
]

[project.urls]
Repository = "https://github.com/REPLACE-WITH-YOUR-USERNAME/moa-shape-derivation"

[project.scripts]
moa-shape = "moa_shape_derivation.cli:main"

[tool.setuptools.packages.find]
include = ["moa_shape_derivation*"]

[tool.setuptools.package-data]
moa_shape_derivation = ["*.c"]
